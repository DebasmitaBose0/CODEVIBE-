name: 'First Interaction'

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Thank you for opening your first issue! Our team will review it soon.'
          pr-message: 'Welcome! Thank you for submitting this pull request. We will review it shortly.'
